name: Build-deploy Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'FinAssistAI.Functions/**'
      - '.github/workflows/azure-function.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-function:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FinAssistAI.Functions/FinAssistAI.Functions.csproj

      - name: Build
        run: dotnet build FinAssistAI.Functions/FinAssistAI.Functions.csproj \
              --configuration Release \
              --no-restore

      - name: Publish
        run: dotnet publish FinAssistAI.Functions/FinAssistAI.Functions.csproj \
              --configuration Release \
              --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function
        uses: Azure/functions-action@v1
        with:
          app-name: 'finassistai-functions-dev'
          package: './publish'
